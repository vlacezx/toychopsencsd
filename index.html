<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notebook</title><link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet"><style> *{ margin:0; padding:0; box-sizing:border-box; } body{ height:100vh; display:flex; justify-content:center; align-items:center; background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.05), transparent 30%), radial-gradient(circle at 80% 80%, rgba(0,0,0,.08), transparent 40%), #8a6d55; font-family:"Special Elite", monospace; } .notebook{ width:min(900px,95vw); height:min(750px,92vh); background:#f4ecd8; border-radius:12px; box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 0 60px rgba(0,0,0,.08); position:relative; overflow:hidden; } /* paper texture */ .notebook::before{ content:""; position:absolute; inset:0; background: repeating-linear-gradient( transparent, transparent 31px, rgba(90,70,40,.08) 32px ), radial-gradient(rgba(0,0,0,.03) 1px, transparent 1px); background-size: 100% 32px, 6px 6px; pointer-events:none; } .red-line{ position:absolute; left:70px; top:0; bottom:0; width:2px; background:#d67b7b; opacity:.5; } textarea{ position:absolute; inset:20px; padding: 18px 24px 18px 70px; width:calc(100% - 40px); height:calc(100% - 40px); resize:none; border:none; outline:none; background:transparent; color:#4b3724; font-family:"Special Elite", monospace; font-size:20px; line-height:32px; overflow:auto; } textarea::placeholder{ color:#8f7d6b; } .saved{ position:absolute; right:20px; bottom:15px; color:#8c7d6c; font-size:13px; opacity:0; transition:.2s; } .saved.show{ opacity:1; } .title{ position:absolute; left:25px; top:18px; font-size:14px; letter-spacing:2px; color:#8b7156; } </style></head><body><div class="notebook"><div class="red-line"></div><textarea id="note" placeholder="Write something..."></textarea><div class="saved" id="saved"> saved </div></div><script> const note = document.getElementById("note"); const saved = document.getElementById("saved"); note.value = localStorage.getItem("notes") || ""; let timeout; note.addEventListener("input", () => { localStorage.setItem("notes", note.value); saved.classList.add("show"); clearTimeout(timeout); timeout = setTimeout(() => { saved.classList.remove("show"); }, 800); }); </script></body></html>
